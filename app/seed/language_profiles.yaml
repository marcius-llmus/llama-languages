      difficulty: "intermediate"
    - name: "Third and Mixed Conditionals: Hypothetical past situations"
      difficulty: "advanced"
    - name: "Passive Voice: All tenses"
      difficulty: "advanced"
    - name: "Reported Speech: Tense backshifting and reporting verbs"
      difficulty: "advanced"
    - name: "Advanced Phrasal Verbs and Idiomatic Expressions"
      difficulty: "advanced"
    - name: "Inversion for Emphasis: 'Not only...', 'Hardly...'"
      difficulty: "advanced"

